<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blush Playlist</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  SUPABASE SETUP (run once in Supabase → SQL Editor):

  create table songs (
    id uuid primary key default gen_random_uuid(),
    title text not null,
    artist text not null default 'Unknown',
    url text not null,
    position int not null default 0,
    created_at timestamptz default now()
  );
  alter table songs enable row level security;
  create policy "anyone can read"   on songs for select using (true);
  create policy "anyone can add"    on songs for insert with check (true);
  create policy "anyone can edit"   on songs for update using (true);
  create policy "anyone can remove" on songs for delete using (true);
  alter publication supabase_realtime add table songs;

  Then paste your Project URL and anon key below.
-->
<style>
:root{--pink:#ff4f9a;--pink2:#ff9cc9;--bg:#fff4f9;--card:#ffffff;--ink:#2d1822;--mute:#a07b8c;--line:#ffdcec;--soft:#ffeaf3}
@media(prefers-color-scheme:dark){:root{--bg:#1c1017;--card:#291720;--ink:#fff0f6;--mute:#c99db3;--line:#3d2331;--soft:#35202b}}
*{box-sizing:border-box;margin:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:24px 16px 48px}
.wrap{max-width:980px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
h1 span{color:var(--pink)}
.pill{background:var(--soft);color:var(--pink);font-size:.8rem;font-weight:500;padding:6px 14px;border-radius:99px;display:flex;gap:6px;align-items:center}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--pink);display:block}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:28px;padding:24px;box-shadow:0 10px 40px rgba(255,79,154,.12)}
.player{text-align:center;position:sticky;top:16px}
.disc{width:200px;height:200px;border-radius:50%;margin:4px auto 20px;background:conic-gradient(from 30deg,var(--pink),var(--pink2),#ffd1e6,var(--pink2),var(--pink));display:grid;place-items:center;box-shadow:0 14px 34px rgba(255,79,154,.35);animation:spin 7s linear infinite;animation-play-state:paused}
.disc.on{animation-play-state:running}
.disc b{width:64px;height:64px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--pink);font-size:1.5rem;font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.disc{animation:none}}
#np-title{font-size:1.15rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np-artist{color:var(--mute);font-size:.9rem;margin-top:2px}
.seek{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-size:.75rem;color:var(--mute)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--pink) var(--v,0%),var(--line) var(--v,0%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--pink);border:3px solid var(--card);box-shadow:0 2px 6px rgba(255,79,154,.5)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--pink);border:3px solid var(--card)}
.ctrls{display:flex;justify-content:center;align-items:center;gap:8px;margin:8px 0 16px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--mute);transition:.15s}
.ic:hover{background:var(--soft);color:var(--pink)}
.ic.act{background:var(--soft);color:var(--pink)}
.ic svg{width:20px;height:20px;fill:currentColor}
.main{width:62px;height:62px;background:var(--pink);color:#fff;box-shadow:0 8px 20px rgba(255,79,154,.45)}
.main:hover{background:#ff3589;color:#fff}
.main svg{width:26px;height:26px}
.vol{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:.8rem}
.vol input{max-width:none}
h2{font-size:1.05rem;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{color:var(--mute);font-weight:400;font-size:.8rem}
ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--card);border:1px solid transparent;transition:.15s}
li:hover{background:var(--soft)}
li.cur{background:var(--soft);border-color:var(--pink2)}
li.drag{opacity:.4}
.n{width:34px;height:34px;border-radius:12px;background:var(--line);color:var(--pink);display:grid;place-items:center;font-weight:600;font-size:.85rem;flex:none;cursor:grab}
li.cur .n{background:var(--pink);color:#fff}
.meta{flex:1;min-width:0;text-align:left;cursor:pointer}
.meta b{display:block;font-weight:500;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--mute);font-size:.8rem}
.acts{display:flex;gap:2px}
.acts .ic{width:32px;height:32px}
.acts .ic svg{width:16px;height:16px}
.empty{text-align:center;color:var(--mute);padding:28px 8px;font-size:.9rem}
form{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
form input[type=text],form input[type=url]{font:inherit;font-size:.9rem;padding:12px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
form input::placeholder{color:var(--mute)}
form .full{grid-column:1/-1}
.add{grid-column:1/-1;background:var(--pink);color:#fff;font-weight:600;padding:13px;border-radius:16px;transition:.15s}
.add:hover{background:#ff3589}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-size:.85rem;transition:.25s;max-width:90vw}
#toast.show{transform:translateX(-50%)}
.demo{background:var(--soft);color:var(--pink);border-radius:16px;padding:10px 16px;font-size:.8rem;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Blush <span>Playlist</span></h1>
    <div class="pill"><i></i><span id="online">1 online</span></div>
  </header>
  <div id="demo" class="demo" hidden>Demo mode: songs are saved only in this tab. Add your Supabase URL and anon key in the script to share this playlist.</div>

  <div class="grid">
    <section class="card player">
      <div class="disc" id="disc"><b id="initial">♪</b></div>
      <div id="np-title">Pick a song</div>
      <div id="np-artist">Your queue is waiting</div>
      <div class="seek"><span id="t1">0:00</span><input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek"><span id="t2">0:00</span></div>
      <div class="ctrls">
        <button class="ic" id="shuffle" title="Shuffle" aria-label="Shuffle"></button>
        <button class="ic" id="prev" title="Previous" aria-label="Previous"></button>
        <button class="ic main" id="toggle" title="Play" aria-label="Play"></button>
        <button class="ic" id="next" title="Next" aria-label="Next"></button>
        <button class="ic" id="loop" title="Loop" aria-label="Loop"></button>
      </div>
      <div class="ctrls" style="margin-top:-4px"><button class="ic" id="stop" title="Stop" aria-label="Stop"></button></div>
      <div class="vol"><span>Vol</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></div>
    </section>

    <section class="card">
      <h2>Up next <small id="count">0 songs</small></h2>
      <ul id="list"></ul>
      <form id="form">
        <input type="text" name="t" placeholder="Song title" required>
        <input type="text" name="a" placeholder="Artist">
        <input class="full" type="url" name="u" placeholder="Link to an mp3 file" required>
        <button class="add" type="submit">Add to playlist</button>
      </form>
    </section>
  </div>
</div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== PASTE YOUR SUPABASE DETAILS HERE ======
const SUPABASE_URL = '';   // e.g. https://xxxx.supabase.co
const SUPABASE_KEY = '';   // anon public key
// ===============================================

const demo = !SUPABASE_URL || !SUPABASE_KEY;
const sb = demo ? null : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = {
  play:'M8 5v14l11-7z', pause:'M6 5h4v14H6zM14 5h4v14h-4z', stop:'M6 6h12v12H6z',
  prev:'M6 6h2v12H6zM9.5 12 18 6v12z', next:'M16 6h2v12h-2zM6 18V6l8.5 6z',
  shuffle:'M17 3l4 4-4 4V8h-2.6l-3 4 3 4H17v-3l4 4-4 4v-3h-3.6l-3.4-4.5L6.6 17H3v-2h2.6l3-4-3-4H3V5h3.6L10 9.5 13.4 5H17z',
  loop:'M7 7h10v3l4-4-4-4v3H5v6h2zM17 17H7v-3l-4 4 4 4v-3h12v-6h-2z',
  up:'M7 14l5-5 5 5z', down:'M7 10l5 5 5-5z', x:'M6 6l12 12M18 6L6 18'
};
const svg = (k, stroke) => `<svg viewBox="0 0 24 24" ${stroke?'fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"':''}><path d="${P[k]}"/></svg>`;

let songs = [], cur = -1, curId = null, shuffle = false, loop = 'off', dragFrom = null;
const audio = new Audio();
audio.volume = .8;

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),3000); }
const fmt = s => isFinite(s) ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') : '0:00';

/* ---------- data ---------- */
async function load(){
  if(!demo){
    const { data, error } = await sb.from('songs').select('*').order('position');
    if(error) return toast(error.message);
    songs = data;
  }
  cur = songs.findIndex(s => s.id === curId);
  render();
}
async function addSong(e){
  e.preventDefault();
  const f = e.target.elements;
  const row = { title:f.t.value.trim(), artist:f.a.value.trim() || 'Unknown', url:f.u.value.trim(),
    position: songs.length ? Math.max(...songs.map(s => s.position)) + 1 : 0 };
  if(demo){ row.id = crypto.randomUUID(); songs.push(row); }
  else { const { error } = await sb.from('songs').insert(row); if(error) return toast(error.message); }
  e.target.reset(); toast('Added to playlist'); load();
}
async function removeSong(id){
  if(id === curId){ stop(); audio.removeAttribute('src'); curId = null; }
  if(demo) songs = songs.filter(s => s.id !== id);
  else { const { error } = await sb.from('songs').delete().eq('id', id); if(error) return toast(error.message); }
  toast('Removed'); load();
}
async function reorder(arr){
  songs = arr.map((s,k) => ({...s, position:k}));
  cur = songs.findIndex(s => s.id === curId);
  render();
  if(!demo){
    const { error } = await sb.from('songs').upsert(songs.map(({id,title,artist,url,position}) => ({id,title,artist,url,position})));
    if(error) toast(error.message);
  }
}
function move(i, d){
  const j = i + d; if(j < 0 || j >= songs.length) return;
  const a = [...songs]; [a[i], a[j]] = [a[j], a[i]]; reorder(a);
}

/* ---------- playback ---------- */
function play(i){
  if(!songs[i]) return;
  cur = i; curId = songs[i].id; audio.src = songs[i].url;
  audio.play().catch(() => toast('This link could not be played. Check the mp3 URL.'));
  render();
}
function toggle(){
  if(cur < 0){ if(songs.length) play(0); return; }
  audio.paused ? audio.play() : audio.pause();
}
function stop(){ audio.pause(); audio.currentTime = 0; }
function next(auto){
  if(!songs.length) return;
  if(auto && loop === 'one'){ audio.currentTime = 0; audio.play(); return; }
  let i;
  if(shuffle && songs.length > 1){ do { i = Math.floor(Math.random()*songs.length); } while(i === cur); }
  else { i = cur + 1; if(i >= songs.length){ if(loop === 'all' || !auto) i = 0; else { stop(); return; } } }
  play(i);
}
function prev(){
  if(!songs.length) return;
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  play(cur <= 0 ? songs.length - 1 : cur - 1);
}

audio.addEventListener('ended', () => next(true));
audio.addEventListener('play', syncUI);
audio.addEventListener('pause', syncUI);
audio.addEventListener('timeupdate', () => {
  const p = audio.duration ? audio.currentTime / audio.duration * 100 : 0;
  const s = $('#seek'); s.value = p; s.style.setProperty('--v', p + '%');
  $('#t1').textContent = fmt(audio.currentTime); $('#t2').textContent = fmt(audio.duration);
});
$('#seek').addEventListener('input', e => { if(audio.duration) audio.currentTime = e.target.value / 100 * audio.duration; });
$('#vol').addEventListener('input', e => { audio.volume = e.target.value; e.target.style.setProperty('--v', e.target.value*100 + '%'); });

/* ---------- UI ---------- */
function syncUI(){
  const playing = !audio.paused;
  $('#toggle').innerHTML = svg(playing ? 'pause' : 'play');
  $('#toggle').title = $('#toggle').ariaLabel = playing ? 'Pause' : 'Play';
  $('#disc').classList.toggle('on', playing);
}
function render(){
  const s = songs[cur];
  $('#np-title').textContent = s ? s.title : 'Pick a song';
  $('#np-artist').textContent = s ? s.artist : 'Your queue is waiting';
  $('#initial').textContent = s ? s.title.trim().charAt(0).toUpperCase() : '♪';
  $('#count').textContent = songs.length + (songs.length === 1 ? ' song' : ' songs');
  $('#shuffle').classList.toggle('act', shuffle);
  $('#loop').classList.toggle('act', loop !== 'off');
  $('#loop').title = 'Loop: ' + loop;
  $('#loop').innerHTML = svg('loop') + (loop === 'one' ? '<span style="position:absolute;font-size:.55rem;font-weight:700;margin-top:1px">1</span>' : '');
  $('#loop').style.position = 'relative';
  const l = $('#list');
  if(!songs.length){ l.innerHTML = '<div class="empty">No songs yet. Add an mp3 link below to start the queue.</div>'; return; }
  l.innerHTML = songs.map((x, i) => `
    <li draggable="true" data-i="${i}" class="${i === cur ? 'cur' : ''}">
      <div class="n" title="Drag to reorder">${i === cur && !audio.paused ? '▶' : i + 1}</div>
      <div class="meta" data-play="${i}"><b>${esc(x.title)}</b><span>${esc(x.artist)}</span></div>
      <div class="acts">
        <button class="ic" data-up="${i}" title="Move up" aria-label="Move up">${svg('up')}</button>
        <button class="ic" data-down="${i}" title="Move down" aria-label="Move down">${svg('down')}</button>
        <button class="ic" data-del="${x.id}" title="Remove" aria-label="Remove">${svg('x', true)}</button>
      </div>
    </li>`).join('');
}

$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-play],[data-up],[data-down],[data-del]'); if(!b) return;
  const d = b.dataset;
  if(d.play !== undefined) play(+d.play);
  else if(d.up !== undefined) move(+d.up, -1);
  else if(d.down !== undefined) move(+d.down, 1);
  else removeSong(d.del);
});
$('#list').addEventListener('dragstart', e => { const li = e.target.closest('li'); if(!li) return; dragFrom = +li.dataset.i; li.classList.add('drag'); });
$('#list').addEventListener('dragend', e => e.target.closest('li')?.classList.remove('drag'));
$('#list').addEventListener('dragover', e => e.preventDefault());
$('#list').addEventListener('drop', e => {
  e.preventDefault();
  const li = e.target.closest('li'); if(!li || dragFrom === null) return;
  const to = +li.dataset.i; if(to === dragFrom) return;
  const a = [...songs]; const [m] = a.splice(dragFrom, 1); a.splice(to, 0, m);
  dragFrom = null; reorder(a);
});

$('#toggle').onclick = toggle;
$('#stop').onclick = stop;
$('#next').onclick = () => next(false);
$('#prev').onclick = prev;
$('#shuffle').onclick = () => { shuffle = !shuffle; toast('Shuffle ' + (shuffle ? 'on' : 'off')); render(); };
$('#loop').onclick = () => { loop = loop === 'off' ? 'all' : loop === 'all' ? 'one' : 'off'; toast('Loop: ' + loop); render(); };
$('#form').addEventListener('submit', addSong);

$('#shuffle').innerHTML = svg('shuffle'); $('#prev').innerHTML = svg('prev');
$('#next').innerHTML = svg('next'); $('#stop').innerHTML = svg('stop'); syncUI();
$('#vol').style.setProperty('--v', '80%');

/* ---------- start ---------- */
if(demo){
  $('#demo').hidden = false;
  songs = [1,2,3].map(n => ({ id:crypto.randomUUID(), title:'Sample Track ' + n, artist:'SoundHelix', position:n-1,
    url:`https://www.soundhelix.com/examples/mp3/SoundHelix-Song-${n}.mp3` }));
  render();
} else {
  load();
  const ch = sb.channel('blush-room', { config:{ presence:{ key:crypto.randomUUID() } } });
  ch.on('postgres_changes', { event:'*', schema:'public', table:'songs' }, load)
    .on('presence', { event:'sync' }, () => { $('#online').textContent = Object.keys(ch.presenceState()).length + ' online'; })
    .subscribe(s => { if(s === 'SUBSCRIBED') ch.track({ at:Date.now() }); });
}
</script>
</body>
</html>
