<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blush Radio · Shared Playlist</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,800;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff5f8;--card:#fff;--ink:#3b1626;--mute:#a8798b;--pink:#ff4f93;--pink2:#ff8fb8;--soft:#ffe1ec;--line:#f9d3e2;--shadow:0 10px 30px rgba(255,79,147,.15);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1d0f16;--card:#2a1620;--ink:#ffe9f1;--mute:#c08fa4;--soft:#3b1d2b;--line:#4a2536;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:24px 16px 48px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(500px 300px at 85% -5%,rgba(255,143,184,.35),transparent),radial-gradient(400px 300px at 0 100%,rgba(255,79,147,.18),transparent);pointer-events:none;z-index:-1}
.wrap{max-width:1000px;margin:auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(2rem,6vw,3.2rem);line-height:1;letter-spacing:-.02em}
h1 em{color:var(--pink);font-style:italic;font-weight:600}
.sub{color:var(--mute);margin-top:6px;font-size:.95rem}
.live{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:99px;font-size:.85rem;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 4px rgba(46,204,113,.2)}.dot.off{background:var(--pink2);box-shadow:0 0 0 4px rgba(255,143,184,.25)}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:22px}
.player{position:sticky;top:16px;text-align:center}
@media(max-width:820px){.player{position:static}}
.art{aspect-ratio:1;border-radius:22px;background:linear-gradient(135deg,var(--pink2),var(--pink));display:grid;place-items:center;font-family:Fraunces,serif;font-size:5rem;color:#fff;font-weight:800;overflow:hidden;box-shadow:0 14px 30px rgba(255,79,147,.35)}
.art.spin{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.97)}}
#nowT{font-family:Fraunces,serif;font-weight:600;font-size:1.3rem;margin-top:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowA{color:var(--mute);font-size:.9rem;margin-top:2px}
.bar{margin:18px 0 6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:linear-gradient(to right,var(--pink) var(--p,0%),var(--soft) var(--p,0%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--pink);border:3px solid #fff;box-shadow:0 2px 6px rgba(255,79,147,.5)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--pink);border:3px solid #fff}
.times{display:flex;justify-content:space-between;color:var(--mute);font-size:.75rem;margin-top:6px}
.ctrls{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:10px}
button{font:inherit;cursor:pointer;border:0;background:none;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink2);outline-offset:2px}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--mute);transition:.15s}
.ic:hover{background:var(--soft);color:var(--pink)}.ic.on{color:var(--pink);background:var(--soft)}
.ic svg{width:20px;height:20px;fill:currentColor}
.big{width:64px;height:64px;background:var(--pink);color:#fff;box-shadow:0 8px 20px rgba(255,79,147,.45)}
.big:hover{background:var(--pink);color:#fff;transform:scale(1.06)}.big svg{width:26px;height:26px}
.vol{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--mute)}.vol svg{width:18px;fill:currentColor;flex:none}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
form .full{grid-column:1/-1}
input[type=text],input[type=url]{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem}
input::placeholder{color:var(--mute)}input[type=text]:focus,input[type=url]:focus{border-color:var(--pink);outline:none}
.file{display:block;text-align:center;padding:16px;border-radius:14px;border:1.5px dashed var(--pink2);background:var(--soft);color:var(--pink);font-weight:500;font-size:.9rem;cursor:pointer;transition:.15s}.file:hover,.file.over{border-color:var(--pink);background:var(--bg)}.file:focus-within{outline:3px solid var(--pink2);outline-offset:2px}.add:disabled{opacity:.6;cursor:wait}
.add{background:var(--pink);color:#fff;font-weight:700;padding:12px;border-radius:14px;box-shadow:0 6px 16px rgba(255,79,147,.35)}
.add:hover{filter:brightness(1.07)}
.qh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.qh h2{font-family:Fraunces,serif;font-size:1.35rem}.qh span{color:var(--mute);font-size:.85rem}
ul{list-style:none;padding:0;display:grid;gap:6px}
li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:1.5px solid transparent;transition:.15s;cursor:grab;background:var(--bg)}
li:hover{border-color:var(--line)}li.cur{background:var(--soft);border-color:var(--pink2)}
li.drag{opacity:.4}li.over{border-color:var(--pink);border-style:dashed}
.n{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-weight:700;color:var(--mute);flex:none;font-size:.85rem}
li.cur .n{background:var(--pink);color:#fff}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px}.eq i{width:3px;background:#fff;border-radius:2px;animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.meta{flex:1;min-width:0;text-align:left;background:none;display:block;cursor:pointer}
.meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{opacity:.5}.del:hover{opacity:1;color:#e11d48}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.banner{background:var(--soft);border:1px dashed var(--pink2);border-radius:16px;padding:12px 16px;font-size:.85rem;margin-bottom:16px;display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;transition:.3s;opacity:0}
#toast.show{transform:translateX(-50%);opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Blush <em>Radio</em></h1><p class="sub">One playlist, everyone listening together.</p></div>
    <div class="live"><span class="dot off" id="dot"></span><span id="liveT">Demo mode</span></div>
  </header>
  <div class="banner" id="banner">Running in demo mode: songs are saved only in this browser. Add your Supabase URL and anon key at the top of the script to share the playlist with everyone.</div>
  <div class="grid">
    <section class="card player" aria-label="Player">
      <div class="art" id="art">♪</div>
      <div id="nowT">Nothing playing</div><div id="nowA">Pick a song from the queue</div>
      <div class="bar"><input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek"></div>
      <div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div>
      <div class="ctrls">
        <button class="ic" id="shuf" title="Shuffle" aria-label="Shuffle"></button>
        <button class="ic" id="prev" title="Previous" aria-label="Previous"></button>
        <button class="ic big" id="play" title="Play / Pause" aria-label="Play or pause"></button>
        <button class="ic" id="next" title="Next" aria-label="Next"></button>
        <button class="ic" id="loop" title="Loop" aria-label="Loop"></button>
      </div>
      <div class="ctrls" style="margin-top:2px"><button class="ic" id="stop" title="Stop" aria-label="Stop"></button></div>
      <div class="vol"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></div>
    </section>
    <section class="card" aria-label="Queue">
      <form id="form">
        <input type="text" id="fT" placeholder="Song title" maxlength="80">
        <input type="text" id="fA" placeholder="Artist" maxlength="80">
        <label class="file full" id="drop" for="fF"><input type="file" id="fF" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.aac" hidden><span id="fN">Choose or drop an audio file (MP3, WAV, M4A, OGG, FLAC, up to 25 MB)</span></label>
        <input type="url" id="fU" class="full" placeholder="Or paste a direct audio link (https://…/song.mp3)">
        <button class="add full" type="submit">Add to playlist</button>
      </form>
      <div class="qh"><h2>Up next</h2><span id="count">0 songs</span></div>
      <ul id="list"></ul>
    </section>
  </div>
</div>
<div id="toast" role="status"></div>
<script>
/* ---- 1. Paste your Supabase project values here (Project Settings > API) ---- */
const SUPABASE_URL = '';
const SUPABASE_KEY = '';
/* ---------------------------------------------------------------------------- */
const $=id=>document.getElementById(id);
const P={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
next:'<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>',prev:'<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>',
stop:'<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>',shuf:'<svg viewBox="0 0 24 24"><path d="M10.6 9.2L5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2.0 2-12.5 12.6 1.4 1.4L17.9 7.4l2.1 2.1V4h-5.5zm.3 9.4l-1.4 1.4 3.1 3.1-2.1 2.1H20v-5.5l-2.0 2-3.2-3.1z"/></svg>',
loop:'<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>',
loop1:'<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>',
x:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>'};
const DEMO=[['Sunny Day Drive','SoundHelix','https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'],['Candy Floss','SoundHelix','https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'],['Late Night Pink','SoundHelix','https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3']];

/* data layer: Supabase when configured, otherwise localStorage demo */
const live=!!(SUPABASE_URL&&SUPABASE_KEY);
let sb,chan,api;
if(live){
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  api={
    list:async()=>{const{data,error}=await sb.from('songs').select('*').order('position');if(error)throw error;return data},
    add:async s=>{const{error}=await sb.from('songs').insert(s);if(error)throw error},
    remove:async id=>{const{data}=await sb.from('songs').select('url').eq('id',id).maybeSingle();const{error}=await sb.from('songs').delete().eq('id',id);if(error)throw error;const m='/object/public/songs/',u=data&&data.url;if(u&&u.includes(m))await sb.storage.from('songs').remove([decodeURIComponent(u.split(m)[1])])},
    move:async(id,position)=>{const{error}=await sb.from('songs').update({position}).eq('id',id);if(error)throw error}};
}else{
  const K='blush_songs',rd=()=>{try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}},wr=v=>{try{localStorage.setItem(K,JSON.stringify(v.filter(x=>!x.tmp)))}catch(e){}};
  let mem=rd()||DEMO.map((d,i)=>({id:'d'+i,title:d[0],artist:d[1],url:d[2],position:i+1}));
  api={list:async()=>[...mem].sort((a,b)=>a.position-b.position),
    add:async s=>{mem.push({...s,id:'l'+Date.now()});wr(mem)},
    remove:async id=>{mem=mem.filter(s=>s.id!==id);wr(mem)},
    move:async(id,p)=>{mem.find(s=>s.id===id).position=p;wr(mem)}};
  $('banner').style.display='block';
}

/* state */
let songs=[],curId=null,loop='off',shuffle=false,history=[];
const au=new Audio();au.preload='metadata';au.volume=.8;
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)};
const idx=()=>songs.findIndex(s=>s.id===curId);
const cur=()=>songs.find(s=>s.id===curId);

function icons(){
  $('play').innerHTML=au.paused?P.play:P.pause;$('next').innerHTML=P.next;$('prev').innerHTML=P.prev;$('stop').innerHTML=P.stop;$('shuf').innerHTML=P.shuf;
  $('loop').innerHTML=loop==='one'?P.loop1:P.loop;
  $('shuf').classList.toggle('on',shuffle);$('loop').classList.toggle('on',loop!=='off');
  $('shuf').title='Shuffle: '+(shuffle?'on':'off');$('loop').title='Loop: '+loop;
}
function render(){
  const s=cur();
  $('nowT').textContent=s?s.title:'Nothing playing';$('nowA').textContent=s?(s.artist||'Unknown artist'):'Pick a song from the queue';
  $('art').textContent=s?s.title.trim().charAt(0).toUpperCase():'♪';$('art').classList.toggle('spin',!!s&&!au.paused);
  $('count').textContent=songs.length+(songs.length===1?' song':' songs');
  const ul=$('list');ul.innerHTML='';
  if(!songs.length){ul.innerHTML='<div class="empty">Your queue is empty. Add a song above to get started.</div>';icons();return}
  songs.forEach((song,i)=>{
    const li=document.createElement('li');li.draggable=true;li.dataset.id=song.id;
    if(song.id===curId){li.className='cur'+(au.paused?' paused':'')}
    const n=document.createElement('div');n.className='n';
    n.innerHTML=song.id===curId?'<span class="eq"><i></i><i></i><i></i></span>':i+1;
    const m=document.createElement('button');m.className='meta';m.type='button';
    const b=document.createElement('b'),sm=document.createElement('small');b.textContent=song.title;sm.textContent=song.artist||'Unknown artist';m.append(b,sm);
    m.onclick=()=>song.id===curId?toggle():start(song.id);
    const d=document.createElement('button');d.className='ic del';d.type='button';d.title='Remove';d.setAttribute('aria-label','Remove '+song.title);d.innerHTML=P.x;
    d.onclick=()=>removeSong(song.id);
    li.append(n,m,d);ul.append(li);
  });icons();
}
async function refresh(){try{songs=await api.list();if(curId&&!cur()){au.pause();au.removeAttribute('src');curId=null}render()}catch(e){toast('Could not load songs: '+e.message)}}

/* playback */
function start(id,noHist){
  const s=songs.find(x=>x.id===id);if(!s)return;
  if(!noHist&&curId&&curId!==id)history.push(curId);
  curId=id;au.src=s.url;au.play().catch(()=>toast('This link could not be played. Use a direct audio URL.'));render();
}
function toggle(){if(!curId){if(songs.length)start(songs[0].id);return}au.paused?au.play().catch(()=>{}):au.pause()}
function stop(){au.pause();au.currentTime=0;render()}
function pickNext(auto){
  if(!songs.length)return null;const i=idx();
  if(shuffle&&songs.length>1){let r;do{r=songs[Math.floor(Math.random()*songs.length)].id}while(r===curId);return r}
  if(i<0)return songs[0].id;
  if(i<songs.length-1)return songs[i+1].id;
  return (loop==='all'||!auto)?songs[0].id:null;
}
function next(auto){const id=pickNext(auto);if(id)start(id);else stop()}
function prev(){
  if(au.currentTime>3){au.currentTime=0;return}
  if(shuffle&&history.length){start(history.pop(),true);return}
  const i=idx();if(i>0)start(songs[i-1].id,true);else if(songs.length)start(songs[songs.length-1].id,true);
}
au.onended=()=>{if(loop==='one'){au.currentTime=0;au.play()}else next(true)};
au.onplay=au.onpause=()=>render();
au.ontimeupdate=()=>{if(!seeking){const p=au.duration?au.currentTime/au.duration*100:0;$('seek').value=p;$('seek').style.setProperty('--p',p+'%')}$('tc').textContent=fmt(au.currentTime)};
au.onloadedmetadata=()=>$('td').textContent=fmt(au.duration);
au.onerror=()=>{if(curId)toast('Playback error. Skipping is up to you.')};
let seeking=false;
$('seek').oninput=e=>{seeking=true;e.target.style.setProperty('--p',e.target.value+'%');if(au.duration)$('tc').textContent=fmt(e.target.value/100*au.duration)};
$('seek').onchange=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration;seeking=false};
$('vol').oninput=e=>{au.volume=e.target.value;e.target.style.setProperty('--p',e.target.value*100+'%')};$('vol').style.setProperty('--p','80%');
$('play').onclick=toggle;$('stop').onclick=stop;$('next').onclick=()=>next(false);$('prev').onclick=prev;
$('shuf').onclick=()=>{shuffle=!shuffle;icons();toast('Shuffle '+(shuffle?'on':'off'))};
$('loop').onclick=()=>{loop={off:'all',all:'one',one:'off'}[loop];icons();toast({off:'Loop off',all:'Looping the playlist',one:'Looping this song'}[loop])};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}});

/* edit queue */
let file=null;
const dz=$('drop'),resetFile=()=>{file=null;$('fF').value='';$('fN').textContent='Choose or drop an audio file (MP3, WAV, M4A, OGG, FLAC, up to 25 MB)'};
function pickFile(f){
  if(!f)return;
  if(!(f.type.startsWith('audio/')||/\.(mp3|wav|m4a|ogg|flac|aac)$/i.test(f.name)))return toast('Please choose an audio file.');
  if(f.size>25*1024*1024)return toast('That file is over 25 MB.');
  file=f;$('fN').textContent=f.name;
  if(!$('fT').value)$('fT').value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
}
$('fF').onchange=e=>pickFile(e.target.files[0]);
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');pickFile(e.dataTransfer.files[0])};
$('form').onsubmit=async e=>{
  e.preventDefault();
  let url=$('fU').value.trim(),title=$('fT').value.trim(),tmp=false;
  if(!file&&!url)return toast('Choose an audio file or paste a link.');
  const btn=e.target.querySelector('.add');btn.disabled=true;
  try{
    if(file){
      btn.textContent='Uploading…';
      if(live){
        const path=Date.now()+'-'+file.name.replace(/[^\w.-]+/g,'_');
        const{error}=await sb.storage.from('songs').upload(path,file,{contentType:file.type||'audio/mpeg'});
        if(error)throw error;
        url=sb.storage.from('songs').getPublicUrl(path).data.publicUrl;
      }else{url=URL.createObjectURL(file);tmp=true}
    }
    if(!title)title='Untitled';
    const last=songs.length?songs[songs.length-1].position:0;
    const row={title,artist:$('fA').value.trim(),url,position:last+1};if(tmp)row.tmp=true;
    await api.add(row);e.target.reset();resetFile();
    toast(tmp?'Added "'+title+'" (kept until you refresh in demo mode)':'Added "'+title+'"');await refresh();
  }catch(err){toast('Could not add song: '+err.message)}
  finally{btn.disabled=false;btn.textContent='Add to playlist'}
};
async function removeSong(id){
  const s=songs.find(x=>x.id===id);
  try{await api.remove(id);toast('Removed "'+s.title+'"');await refresh()}catch(err){toast('Could not remove: '+err.message)}
}
let dragId=null;const ul=$('list');
ul.addEventListener('dragstart',e=>{const li=e.target.closest('li');if(!li)return;dragId=li.dataset.id;li.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
ul.addEventListener('dragend',()=>{dragId=null;ul.querySelectorAll('li').forEach(l=>l.classList.remove('drag','over'))});
ul.addEventListener('dragover',e=>{e.preventDefault();const li=e.target.closest('li');ul.querySelectorAll('li').forEach(l=>l.classList.toggle('over',l===li&&l.dataset.id!==dragId))});
ul.addEventListener('drop',async e=>{
  e.preventDefault();const li=e.target.closest('li');if(!li||!dragId||li.dataset.id===dragId)return;
  const from=songs.findIndex(s=>s.id===dragId),to=songs.findIndex(s=>s.id===li.dataset.id);
  const rest=songs.filter(s=>s.id!==dragId);const ins=to;           /* insert at the drop target's slot */
  const before=rest[ins-1],after=rest[ins];
  const pos=before&&after?(before.position+after.position)/2:before?before.position+1:after.position-1;
  const moved=songs[from];moved.position=pos;songs=[...songs].sort((a,b)=>a.position-b.position);render();
  try{await api.move(moved.id,pos)}catch(err){toast('Could not reorder: '+err.message);refresh()}
});

/* realtime: shared queue + who's listening */
if(live){
  const uid=crypto.randomUUID();
  chan=sb.channel('blush-room',{config:{presence:{key:uid}}})
    .on('postgres_changes',{event:'*',schema:'public',table:'songs'},()=>refresh())
    .on('presence',{event:'sync'},()=>{const n=Object.keys(chan.presenceState()).length;$('liveT').textContent=n+(n===1?' listener online':' listeners online')})
    .subscribe(async st=>{if(st==='SUBSCRIBED'){$('dot').classList.remove('off');await chan.track({at:Date.now()})}});
  $('liveT').textContent='Connecting…';
}
icons();refresh();
</script>
